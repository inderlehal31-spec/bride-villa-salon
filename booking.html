<body>

<!-- ================= NAVBAR ================= -->

<header>

<div class="container navbar">

<!-- ================= BOOKING SECTION ================= -->

<section>

<div class="container">

<h2 class="section-title">Book Your Appointment</h2>

<p style="text-align:center; margin-bottom:40px;">
Reserve your bridal beauty session with Bride Villa Salon.
</p>

<form class="booking-form" id="bookingForm">

<input
type="text"
id="name"
placeholder="Full Name"
required
>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required
>

<input
type="email"
id="email"
placeholder="Email Address"
required
>

<select id="service" required>

<option value="">Select Service</option>
<option>Bridal Makeup</option>
<option>Party Makeup</option>
<option>Hair Styling</option>
<option>Pre-Bridal Package</option>
<option>Skin Treatment</option>

</select>

<input
type="date"
id="date"
required
>

<input
type="time"
id="time"
required
>

<textarea
id="message"
rows="4"
placeholder="Additional Message (Optional)"
></textarea>

<button class="btn" type="submit">

Book Appointment

</button>

</form>

</div>

</section>

<!-- ================= CONTACT INFO ================= -->

<section style="background:white; text-align:center;">

<div class="container">

<h2>Contact Bride Villa Salon</h2>

<br>

<p>📍 Luxury Bridal Studio</p>

<p>📞 Phone: +91 XXXXX XXXXX</p>

<p>📧 Email: bridevilla@email.com</p>

</div>

</section>
